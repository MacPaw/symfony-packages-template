services:
  php:
    build:
      context: .
      dockerfile: .infrastructure/docker/php/Dockerfile
    ports:
      - "${PHP_SERVER_PORT:-8000}:8000"
    volumes:
      - .:/app
      - /app/vendor
    environment:
      - PHP_SERVER_PORT=${PHP_SERVER_PORT:-8000}
    env_file:
      - .env
    working_dir: /app
    command: php -S 0.0.0.0:${PHP_SERVER_PORT:-8000} -t public
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

